name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src custom_components tools tests tests_ha
      - name: Check formatting
        run: ruff format --check src custom_components tools tests tests_ha
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Build installation ZIP
        run: python tools/package_integration.py
      - uses: actions/upload-artifact@v4
        with:
          name: taelek-installation
          path: dist/*.zip
          if-no-files-found: error
